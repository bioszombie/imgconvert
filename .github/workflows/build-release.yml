name: Build & Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release (for example 2.1.0; omit the v prefix)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Standalone build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            runner: ubuntu-22.04
            artifact: imgconvert-linux-x86_64
          - label: Windows x86-64
            runner: windows-2022
            artifact: imgconvert-windows-x86_64.exe
          - label: macOS Intel
            runner: macos-15-intel
            artifact: imgconvert-macos-x86_64
          - label: macOS Apple Silicon
            runner: macos-15
            artifact: imgconvert-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml

      - name: Install locked build toolchain
        run: |
          python -m pip install --no-deps --only-binary=:all: -r requirements-build.txt
          python -m pip check
          python -m pip --version

      - name: Build standalone executable
        run: python scripts/build_executable.py --artifact-name "${{ matrix.artifact }}"

      - name: Verify standalone executable
        run: python scripts/verify_executable.py "release/${{ matrix.artifact }}"

      - name: Upload standalone executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Resolve and validate release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "+refs/heads/master:refs/remotes/origin/master" --tags --force

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "Manual releases must be dispatched from master." >&2
              exit 1
            fi

            tag="v${REQUESTED_VERSION}"
            python scripts/check_release_tag.py "$tag"

            git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
              echo "Release commit is not reachable from master." >&2
              exit 1
            }

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag $tag already exists; version tags are immutable." >&2
              exit 1
            fi

            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null

            echo "Created $tag at $GITHUB_SHA after all standalone builds passed."
          else
            tag="$GITHUB_REF_NAME"
            python scripts/check_release_tag.py "$tag"

            git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
              echo "Release commit is not reachable from master." >&2
              exit 1
            }
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download standalone executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: imgconvert-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: python scripts/write_checksums.py release-assets release-assets/SHA256SUMS

      - name: Attest release binaries and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/imgconvert-*
            release-assets/SHA256SUMS

      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "imgconvert $RELEASE_TAG"
